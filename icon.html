<div
  class="prs-stage"
  role="img"
  aria-label="Parser. Ideas complejas, soluciones directas."
  style="
    position: relative;
    width: 100%;
    height: 280px;
    box-sizing: border-box;
    padding: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    overflow: hidden;
    --loop: 4.4s;
    --t0: 2.7s;
    isolation: isolate;
    background: linear-gradient(35deg, #f4608a 0%, #ec4aa0 55%, #dc44d0 100%);
  "
>
  <div class="prs-bg prs-bg-a"></div>
  <div class="prs-bg prs-bg-b"></div>

  <svg
    class="prs-logo"
    viewBox="112 25 768 406"
    aria-hidden="true"
    style="
      position: relative;
      z-index: 1;
      display: block;
      width: min(88%, 480px);
      height: auto;
      overflow: visible;
    "
  >
    <style>
      /* ================= Fondo: brillos que giran por la pantalla ================= */
      .prs-bg {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 150%;
        aspect-ratio: 1;
        z-index: 0;
        pointer-events: none;
        will-change: transform;
      }

      .prs-bg-a {
        background: radial-gradient(
          ellipse 36% 36% at 50% 86%,
          rgba(255, 176, 32, 1) 0%,
          rgba(255, 160, 40, 0.65) 40%,
          rgba(255, 160, 40, 0) 100%
        );
        animation: prs-bgspin 32s linear infinite;
      }

      .prs-bg-b {
        background: radial-gradient(
          ellipse 34% 34% at 50% 14%,
          rgba(201, 60, 248, 0.95) 0%,
          rgba(201, 60, 248, 0.55) 42%,
          rgba(201, 60, 248, 0) 100%
        );
        animation: prs-bgspin 46s linear infinite reverse;
      }

      @keyframes prs-bgspin {
        from {
          transform: translate(-50%, -50%) rotate(45deg);
        }
        to {
          transform: translate(-50%, -50%) rotate(405deg);
        }
      }

      /* ================= Entrada (una sola vez) ================= */
      .prs-draw {
        stroke-dasharray: 1;
        animation: prs-draw 0.75s cubic-bezier(0.3, 0.7, 0.2, 1) backwards;
        animation-delay: var(--d, 0s);
      }

      .prs-dotg {
        transform-box: fill-box;
        transform-origin: center;
        animation:
          prs-pop 0.5s cubic-bezier(0.3, 1.6, 0.5, 1) 0.6s backwards,
          prs-bump var(--loop) ease-in-out var(--t0) infinite;
      }

      .prs-wm {
        font-family:
          Inter,
          "Segoe UI",
          system-ui,
          -apple-system,
          "Helvetica Neue",
          Arial,
          sans-serif;
        font-weight: 800;
        font-size: 70px;
        letter-spacing: -1px;
      }

      .prs-wm-in {
        animation: prs-rise 0.8s cubic-bezier(0.2, 0.7, 0.2, 1) 1.3s backwards;
      }

      .prs-tag {
        font-family:
          Inter,
          "Segoe UI",
          system-ui,
          -apple-system,
          "Helvetica Neue",
          Arial,
          sans-serif;
        font-weight: 500;
        font-size: 30px;
        letter-spacing: 0.3px;
      }

      .prs-w {
        animation: prs-fa 0.8s ease-out backwards;
        animation-delay: var(--d, 0s);
      }

      /* ================= Brillos orbitando el nodo ================= */
      .prs-orbit {
        fill: none;
        stroke: #fff;
        stroke-linecap: round;
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        animation:
          prs-fadein 0.8s ease-out 1.7s forwards,
          prs-spin 3.4s linear infinite;
      }

      .prs-orbit-b {
        animation:
          prs-fadein 0.8s ease-out 1.9s forwards,
          prs-spin 5.2s linear infinite reverse;
      }

      /* ================= Flujo continuo dentro del trazo ================= */
      .prs-flow {
        fill: none;
        stroke: #fff;
        stroke-width: 2.5;
        stroke-dasharray: 4 12;
        opacity: 0;
        animation:
          prs-flow 0.8s linear infinite,
          prs-flowin 1s ease-out 1.9s forwards;
      }

      /* ================= Bucle: pulsos, chispas, onda ================= */
      .prs-pulse {
        fill: none;
        stroke: #fff;
        stroke-width: 12;
        stroke-dasharray: 0.28 3;
        stroke-dashoffset: 0.28;
        opacity: 0;
      }

      .prs-p-in {
        animation: prs-in var(--loop) cubic-bezier(0.45, 0, 0.55, 1) infinite;
        animation-delay: calc(var(--t0) + var(--s, 0s));
      }

      .prs-p-bar {
        animation: prs-bar var(--loop) cubic-bezier(0.45, 0, 0.7, 0.8) var(--t0)
          infinite;
      }

      .prs-p-arm {
        animation: prs-arm var(--loop) cubic-bezier(0.3, 0.2, 0.5, 1) var(--t0)
          infinite;
      }

      .prs-spark {
        fill: #fff;
        opacity: 0;
      }

      .prs-s-in {
        animation: prs-spark-in var(--loop) ease-in infinite;
        animation-delay: calc(var(--t0) + var(--s, 0s));
      }

      .prs-s-out {
        animation: prs-spark-out var(--loop) ease-in var(--t0) infinite;
      }

      .prs-ring {
        fill: none;
        stroke: #fff;
        stroke-width: 2.5;
        vector-effect: non-scaling-stroke;
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        animation: prs-ring var(--loop) cubic-bezier(0.2, 0.6, 0.3, 1) var(--t0)
          infinite;
      }

      .prs-core {
        opacity: 0;
        animation: prs-core var(--loop) ease-in-out var(--t0) infinite;
      }

      /* El impulso "empuja" las flechas */
      .prs-nudge-in {
        animation: prs-nudge-in var(--loop) ease-in-out infinite;
        animation-delay: calc(var(--t0) + var(--s, 0s));
      }

      .prs-nudge-out {
        animation: prs-nudge-out var(--loop) ease-in-out var(--t0) infinite;
      }

      /* Destello que barre el logo completo (solo se ve sobre el negro) */
      .prs-sheen {
        animation: prs-sheen var(--loop) cubic-bezier(0.5, 0, 0.3, 1) var(--t0)
          infinite;
      }

      @keyframes prs-draw {
        from {
          stroke-dashoffset: 1;
        }
        to {
          stroke-dashoffset: 0;
        }
      }

      @keyframes prs-pop {
        from {
          transform: scale(0);
        }
        to {
          transform: scale(1);
        }
      }

      @keyframes prs-rise {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes prs-fa {
        from {
          fill-opacity: 0;
        }
        to {
          fill-opacity: 1;
        }
      }

      @keyframes prs-fadein {
        to {
          opacity: 1;
        }
      }

      @keyframes prs-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes prs-flow {
        to {
          stroke-dashoffset: -16;
        }
      }

      @keyframes prs-flowin {
        to {
          opacity: 0.32;
        }
      }

      /* Entradas: los tres pulsos llegan al vértice a la vez (0–22 %) */
      @keyframes prs-in {
        0% {
          stroke-dashoffset: 0.28;
          opacity: 0;
        }
        3% {
          opacity: 1;
        }
        17% {
          opacity: 1;
        }
        22% {
          stroke-dashoffset: -1;
          opacity: 0;
        }
        100% {
          stroke-dashoffset: -1;
          opacity: 0;
        }
      }

      @keyframes prs-nudge-in {
        0%,
        19% {
          transform: translateY(0);
        }
        24% {
          transform: translateY(5px);
        }
        36%,
        100% {
          transform: translateY(0);
        }
      }

      @keyframes prs-spark-in {
        0%,
        21.5% {
          opacity: 0;
          transform: translateY(0);
        }
        22% {
          opacity: 1;
          transform: translateY(0);
        }
        27.5% {
          opacity: 1;
          transform: translateY(19px);
        }
        28.5%,
        100% {
          opacity: 0;
          transform: translateY(19px);
        }
      }

      /* Nodo central (31–48 %) */
      @keyframes prs-bump {
        0%,
        31% {
          transform: scale(1);
        }
        35% {
          transform: scale(1.32);
        }
        48%,
        100% {
          transform: scale(1);
        }
      }

      @keyframes prs-core {
        0%,
        31% {
          opacity: 0;
        }
        35% {
          opacity: 0.95;
        }
        50%,
        100% {
          opacity: 0;
        }
      }

      @keyframes prs-ring {
        0%,
        31% {
          transform: scale(1);
          opacity: 0;
        }
        32% {
          transform: scale(1);
          opacity: 0.9;
        }
        58%,
        100% {
          transform: scale(3.4);
          opacity: 0;
        }
      }

      /* Salida única (37–68 %) */
      @keyframes prs-spark-out {
        0%,
        37.5% {
          opacity: 0;
          transform: translateX(0);
        }
        38% {
          opacity: 1;
          transform: translateX(0);
        }
        43% {
          opacity: 1;
          transform: translateX(20px);
        }
        44%,
        100% {
          opacity: 0;
          transform: translateX(20px);
        }
      }

      @keyframes prs-bar {
        0%,
        43% {
          stroke-dashoffset: 0.28;
          opacity: 0;
        }
        44% {
          opacity: 1;
        }
        51% {
          opacity: 1;
        }
        53.5%,
        100% {
          stroke-dashoffset: -1;
          opacity: 0;
        }
      }

      @keyframes prs-arm {
        0%,
        51% {
          stroke-dashoffset: 0.28;
          opacity: 0;
        }
        52% {
          opacity: 1;
        }
        62% {
          opacity: 1;
        }
        66%,
        100% {
          stroke-dashoffset: -1;
          opacity: 0;
        }
      }

      @keyframes prs-nudge-out {
        0%,
        51% {
          transform: translateX(0);
        }
        56% {
          transform: translateX(8px);
        }
        68%,
        100% {
          transform: translateX(0);
        }
      }

      /* Destello (70–92 %) */
      @keyframes prs-sheen {
        0%,
        70% {
          transform: translateX(0);
        }
        92%,
        100% {
          transform: translateX(1100px);
        }
      }
    </style>
